# =============================================================================
# DocumentDB / MongoDB Connection Configuration
# =============================================================================
# Uses AWS IAM authentication (MONGODB-AWS mechanism) via SSH tunnel.
# AWS credentials are read from environment variables:
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN
# Run your SAML login (e.g., saml2aws login) before starting the application.

spring.data.mongodb.uri=mongodb://${DOCDB_HOST:localhost}:${DOCDB_PORT:27017}/${DOCDB_DATABASE:devstandards}?tls=true&tlsAllowInvalidHostnames=true&directConnection=true&authSource=%24external&authMechanism=MONGODB-AWS&retryWrites=false

# Path to the AWS DocumentDB CA certificate bundle (global-bundle.pem)
docdb.tls.caFile=${DOCDB_CA_FILE:/home/cloud-ops/global-bundle.pem}

# =============================================================================
# Application Configuration
# =============================================================================
spring.application.name=devstandards-demo
server.port=8080

# MongoDB auto-index creation (also handled programmatically in IndexInitializer)
spring.data.mongodb.auto-index-creation=true
