# =============================================================================
# DocumentDB / MongoDB Connection Configuration
# =============================================================================
# Replace these values with your actual DocumentDB cluster details.
# In production, use environment variables or AWS Secrets Manager.

spring.data.mongodb.uri=mongodb://${DOCDB_USERNAME:admin}:${DOCDB_PASSWORD:password}@${DOCDB_HOST:localhost}:${DOCDB_PORT:27017}/${DOCDB_DATABASE:devstandards}?tls=true&tlsAllowInvalidHostnames=true&retryWrites=false

# Path to the AWS DocumentDB CA certificate bundle (global-bundle.pem)
docdb.tls.caFile=${DOCDB_CA_FILE:/opt/certs/global-bundle.pem}

# =============================================================================
# Application Configuration
# =============================================================================
spring.application.name=devstandards-demo
server.port=8080

# MongoDB auto-index creation (also handled programmatically in IndexInitializer)
spring.data.mongodb.auto-index-creation=true
